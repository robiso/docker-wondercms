name: 'Publish WonderCMS image to GHCR'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'WonderCMS release tag to build (empty: the Dockerfile default)'
        required: false
        default: ''
      sha256:
        description: 'sha256 of the release tarball (required when the version is not the Dockerfile default)'
        required: false
        default: ''
      latest:
        description: 'Also tag the image as latest'
        type: boolean
        default: true
  schedule:
    # Weekly rebuild of the current version for base image and Debian updates
    - cron: '23 4 * * 1'
  pull_request:
    branches:
      - master
    paths:
      - Dockerfile
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/robiso/wondercms
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    if: github.repository == 'robiso/docker-wondercms'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and checksum
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA256: ${{ inputs.sha256 }}
          INPUT_LATEST: ${{ inputs.latest }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          default_version=$(sed -n 's/^ARG WONDERCMS_VERSION=//p' Dockerfile)
          default_sha=$(sed -n 's/^ARG WONDERCMS_SHA256=//p' Dockerfile)
          version=${INPUT_VERSION:-$default_version}
          if [ "$version" = "$default_version" ]; then
            sha=${INPUT_SHA256:-$default_sha}
          else
            sha=$INPUT_SHA256
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a release version (X.Y.Z); branch builds are local only"
            exit 1
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::a sha256 of the $version tarball is required (input sha256)"
            exit 1
          fi
          # Only a version the core has tagged is ever published
          if ! git ls-remote --exit-code --tags https://github.com/WonderCMS/wondercms "refs/tags/$version" > /dev/null; then
            echo "::error::WonderCMS/wondercms has no tag $version"
            exit 1
          fi
          tags="$IMAGE:$version"
          if [ "$EVENT" = schedule ] || [ "$INPUT_LATEST" = true ]; then
            tags="$tags"$'\n'"$IMAGE:latest"
          fi
          {
            echo "version=$version"
            echo "sha256=$sha"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building WonderCMS $version for $PLATFORMS" >> "$GITHUB_STEP_SUMMARY"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=WonderCMS
            org.opencontainers.image.description=WonderCMS ${{ steps.version.outputs.version }} on PHP and Apache (development settings)
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache, so every run takes a fresh apt-get upgrade
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            WONDERCMS_VERSION=${{ steps.version.outputs.version }}
            WONDERCMS_SHA256=${{ steps.version.outputs.sha256 }}
          tags: ${{ steps.version.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show the pushed image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          set -euo pipefail
          while read -r tag; do
            docker buildx imagetools inspect "$tag" | tee -a "$GITHUB_STEP_SUMMARY"
          done <<< "$TAGS"
